<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121820"><title>トレーニング記録</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell"><header><span class="badge">胸・三頭筋 ／ 実機テスト準備版</span><h1>トレーニング記録</h1></header>
<main><p id="error" role="alert" hidden></p><div id="app"></div><section class="tools"><button id="backup">バックアップを書き出す</button><label for="import">バックアップから復元</label><input id="import" type="file" accept=".json,application/json"><p id="backup-status" aria-live="polite"></p><details><summary>保存とテストについて</summary><p>このChrome内に保存します。サイトデータを消すと記録が失われます。定期的にバックアップしてください。</p><p>公開先とローカル版は保存場所が別です。移行にはバックアップと復元を使います。ジムの重量表示と選択肢は実機テストで確認してください。</p></details></section></main></div><script type="module" src="ui.mjs"></script></body></html>
